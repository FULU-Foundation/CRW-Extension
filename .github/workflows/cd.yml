name: Build and release extension

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        run: npm run update-version
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          AMO_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}

      - name: Run ESLint
        run: npm run lint

      - name: Run Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build outputs
        run: |
          test -d dist/chrome
          test -d dist/firefox

      - name: Zip Chrome
        working-directory: dist/chrome
        run: zip -r ../../chrome-extension.zip .

      - name: Zip Firefox
        working-directory: dist/firefox
        run: zip -r ../../firefox-extension.zip .

      - name: Validate release tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git fetch --tags

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG belongs to another commit; refusing to overwrite the release."
              exit 1
            fi
            echo "Reusing $TAG for a retry of the same release commit."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            chrome-extension.zip
            firefox-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Chrome release package
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern chrome-extension.zip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: chrome-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

  publish-firefox:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Firefox release package
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern firefox-extension.zip
          unzip -q firefox-extension.zip -d dist/firefox
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}

      - name: Publish to Firefox Add-ons (AMO)
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "AMO secrets not set, skipping Firefox publish."
            exit 0
          fi

          npx --yes web-ext@10.6.0 sign \
            --source-dir dist/firefox \
            --channel listed \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --api-url-prefix https://addons.mozilla.org/api/v5 \
            --approval-timeout 0
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
